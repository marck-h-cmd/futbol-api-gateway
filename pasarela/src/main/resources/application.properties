spring.application.name=pasarela
server.port=8080

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Rutas de Pasarela usando Spring Cloud Gateway MVC y Eureka LoadBalancer
spring.cloud.gateway.mvc.routes[0].id=servicio-equipos
spring.cloud.gateway.mvc.routes[0].uri=lb://servicio-equipos
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/equipos/**

spring.cloud.gateway.mvc.routes[1].id=servicio-encuentros
spring.cloud.gateway.mvc.routes[1].uri=lb://servicio-encuentros
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/encuentros/**
